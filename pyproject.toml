[project]
name = "rag-pdf-app"
version = "0.1.0"
description = "PDF RAG prototype with Gemini (Vertex AI), LangChain, FAISS, and Qdrant"
readme = "README.md"
requires-python = ">=3.12"
authors = []

dependencies = [
  "antlr4-python3-runtime==4.9.3",
  "camelot-py>=0.11.0",
  "datasets>=3.0.0",
  "docling>=2.10.0",
  "faiss-cpu>=1.9.0",
  "google-auth>=2.30.0",
  "google-genai>=1.0.0",
  "google-cloud-aiplatform>=1.70.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-google-vertexai>=2.0.0",
  "langfuse>=2.0.0",
  "opencv-python-headless>=4.9.0.80",
  "pandas>=2.2.0",
  "pdfminer.six>=20231228",
  "pydantic-settings>=2.7.0",
  "pylatexenc==2.10",
  "pymupdf>=1.24.0",
  "pypdf>=5.1.0",
  "qdrant-client>=1.11.0",
  "rank-bm25>=0.2.2",
  "ragas>=0.2.6",
  "streamlit>=1.40.0",
  "tabulate>=0.9.0",
]

[project.scripts]
rag-pdf-eval = "rag_pdf_app.eval.run:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pre-commit>=4.0.0",
  "ruff>=0.8.0",
]
phase3 = [
  "sentence-transformers>=3.0.0",
]
phase6 = [
  # Multilingual CLIP-aligned queries (sentence-transformers) + HF ViT patch encoding (+ Pillow; Torch).
  "pillow>=10.4.0",
  "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# PyPI publishes these only as sdists; vendor wheels so CI can run `uv sync --no-build`.
[tool.uv.sources]
antlr4-python3-runtime = { path = "third_party/wheels/antlr4_python3_runtime-4.9.3-py3-none-any.whl" }
pylatexenc = { path = "third_party/wheels/pylatexenc-2.10-py3-none-any.whl" }

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
