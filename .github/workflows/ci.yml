name: Quality assurance

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  python_qa_and_sonar:
    runs-on: ubuntu-latest

    env:
      GOOGLE_CLOUD_PROJECT: ci-placeholder-project

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Sync environment (locked)
        run: uv sync --frozen --extra dev --python 3.12

      - name: Pre-commit (ruff lint + format)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: pytest (coverage + junit)
        run: |
          mkdir -p reports
          uv run pytest \
            --maxfail=1 \
            --disable-warnings \
            --cov=rag_pdf_app \
            --cov-report=xml \
            --junitxml=reports/junit-report.xml

      - name: SonarQube Scan (default branch pushes only)
        # `secrets.*` cannot be used in `if:` (workflow validation fails). Tokens are passed via env below.
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
